<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agentic TODO Viewer</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#1f2937;background:#f8fafc}header{padding:14px 18px;background:#172033;color:white;display:flex;gap:12px;align-items:center}header b{margin-right:auto}button,input{padding:7px 10px}.app{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 56px)}nav{background:white;border-right:1px solid #ddd;padding:14px;overflow:auto}.cat{font-weight:700;margin:12px 0 5px}.folder{margin-left:8px;font-weight:600}.item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;margin-left:8px;border-radius:4px;cursor:pointer}.item:hover{background:#eef2ff}main{padding:26px;max-width:1000px}pre{white-space:pre-wrap;background:#111827;color:#f3f4f6;padding:14px;border-radius:7px;overflow:auto}.notice{background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:6px;margin:12px 0}@media(max-width:700px){.app{grid-template-columns:1fr}nav{max-height:40vh;border-bottom:1px solid #ddd}}</style></head>
<body><header><b>Agentic TODO Standalone Viewer</b><input id=q placeholder="Search"><button id=pick hidden>Choose todo folder…</button></header><div class=app><nav id=nav></nav><main id=main><h1>Loading…</h1></main></div>
<script>
let tree=null,dirHandle=null;const nav=document.querySelector('#nav'),main=document.querySelector('#main'),pick=document.querySelector('#pick');
async function start(){try{const r=await fetch('./todo_items/tree.json',{cache:'no-store'});if(!r.ok)throw 0;tree=await r.json();render();main.innerHTML='<h1>Agentic TODO Board</h1><p>Select an item from the navigator.</p>'}catch(e){if(location.protocol==='file:'&&window.showDirectoryPicker){pick.hidden=false;main.innerHTML='<h1>Choose the storage root</h1><p>This file was opened directly. Choose the <code>todo</code> directory to read its data.</p>'}else main.innerHTML='<h1>Unable to load data</h1><div class=notice>Serve the <code>todo/</code> directory with a static web server so <code>todo_items/tree.json</code> is available, or open this viewer via file:// in a browser that supports the File System Access API.</div>'}}
pick.onclick=async()=>{dirHandle=await showDirectoryPicker({mode:'read'});const d=await dirHandle.getDirectoryHandle('todo_items');const h=await d.getFileHandle('tree.json');tree=JSON.parse(await (await h.getFile()).text());render();main.innerHTML='<h1>Agentic TODO Board</h1><p>Select an item.</p>'};
function all(){let a=[];for(const c of tree?.categories||[])for(const ch of c.children||[]){if(ch.kind==='item')a.push({i:ch,c});else for(const i of ch.children||[])a.push({i,c,f:ch})}return a}
function render(){const q=document.querySelector('#q').value.toLowerCase();let h='';for(const c of tree.categories){const rows=all().filter(x=>x.c.id===c.id&&(!q||(x.i.title+' '+(x.i.notes||'')).toLowerCase().includes(q)));if(!rows.length)continue;h+='<div class=cat>'+e(c.label)+'</div>';let f='';for(const r of rows){if(r.f&&r.f.id!==f){h+='<div class=folder>📁 '+e(r.f.title)+'</div>';f=r.f.id}h+='<button class=item data-id="'+r.i.id+'">'+e(r.i.title)+'</button>'}}nav.innerHTML=h;nav.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>show(b.dataset.id))}
async function show(id){const r=all().find(x=>x.i.id===id),i=r.i;let doc='';try{if(dirHandle){const d=await (await dirHandle.getDirectoryHandle('todo_items')).getDirectoryHandle('item-details');doc=await (await d.getFileHandle(i.artifactBase+'.md')).getFile();doc=await doc.text()}else{const x=await fetch('./todo_items/item-details/'+encodeURIComponent(i.artifactBase)+'.md');if(x.ok)doc=await x.text()}}catch{}main.innerHTML='<h1>'+e(i.title)+'</h1><p><b>Category:</b> '+e(r.c.label)+' · <b>Type:</b> '+e(i.type)+' · <b>Facets:</b> '+e((i.facets||[]).join(', ')||'none')+'</p><p><b>Status:</b> E '+e(i.steps.expand.state)+' · P '+e(i.steps.plan.state)+' · B '+e(i.steps.build.state)+'</p><h2>Curated item document</h2>'+(doc?'<pre>'+e(doc)+'</pre>':'<p>No curated document was found.</p>')}
function e(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}document.querySelector('#q').oninput=()=>tree&&render();start();
</script></body></html>
