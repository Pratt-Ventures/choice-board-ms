[supervisord]
nodaemon=true
stdout_logfile=%(ENV_SHARED_STORAGE_PATH)s/logs/powerchoice-supervisor.log
stdout_logfile_maxbytes=0

[program:powerchoice_server]
priority=1
# command=src/.venv/bin/fastapi dev src/pvf/pvf_app_runner.py --host 0.0.0.0 # Use this one for debugging
command=src/.venv/bin/fastapi run src/pvf/pvf_app_runner.py --host 0.0.0.0 --port 9010
autorestart=true
startsecs=300
stdout_logfile=%(ENV_SHARED_STORAGE_PATH)s/logs/powerchoice-server.log
stdout_logfile_maxbytes=0

[program:powerchoice_watcher]
priority=1
command=./start-job-runner.sh
autorestart=true
startsecs=300
stdout_logfile=%(ENV_SHARED_STORAGE_PATH)s/logs/powerchoice-watcher.log
stdout_logfile_maxbytes=0