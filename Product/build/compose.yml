# build/compose.yml — preview sample (friendly, follows example.env)
# Kept for `docker compose -f build/compose.yml up` compatibility.
# Prefer `compose.preview.yml` at the repo root — same stack, context is repo root there.
#
# Setup: cp example.env .env  (set UNIQUE_CONFIGURATION_CHECK=1 and fill secrets)
#        docker compose -f build/compose.yml up --build -d   # from repo root
# See compose.preview.yml header for full instructions and env var list.

services:
  powerchoice:
    build:
      context: ..
      dockerfile: build/Dockerfile
    image: powerchoice-service:preview
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      SERVER_ENV: preview
      PLATFORM_LINUX: 1
      DB_PATH_OR_CONNECTION_STRING: postgresql+psycopg://powerchoice:${POSTGRES_PASSWORD:-powerchoice_preview_password}@postgres:5432/powerchoice_preview
      APPLICATION_BASE_URL: ${APPLICATION_BASE_URL:-http://localhost:9010}
      SHARED_STORAGE_PATH: /home/ubuntu/tmp
    ports:
      - "${HOST_PORT:-9010}:9010"
    volumes:
      - shared_storage:/home/ubuntu/tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9010/alive || curl -fsS http://localhost:9010/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: powerchoice
      POSTGRES_USER: powerchoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-powerchoice_preview_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerchoice -d powerchoice"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No Windows bind paths — pgdata and shared_storage are named volumes below.

volumes:
  pgdata:
  shared_storage:
