# pvf_app_startup.yaml — deployment-fixed startup configuration for this application.
# Values here are applied by the pvf startup logic (pvf_app_runner / pvf_get_alembic_config)
# and are read-only at runtime; they cannot be supplied by .env or process environment.

application:
  shell_module: src.app_shell        # module loaded as the application bridge
  entry_point: app_startup           # callable receiving the PvfInvocation object
  models_module: src.db.models.bootstrap  # imports all app table specs (alembic schema probe)

env_file: .env                       # environment variable file, ingested with python-dotenv

features:
  activate_stripe_integration: true
  activate_branding_image_store: true
  activate_share_links: true
  activate_external_api: true
  activate_customer_communication: true
  activate_ai_agents: true

share:
  # Share types this application offers (what is being shared).
  object_actions: [not_set, vote, vote_view, report]
  # Operations that can be journaled against a share (what recipients did).
  access_operations: [not_set, vote, view, report]
