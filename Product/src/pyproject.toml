[tool.poetry]
name = "powerchoice"
version = "1.0.0"
description = "Back end APIs for the PowerChoice Service product"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = {extras = ["standard"], version = "^0.115.4"}
PyJWT = "^2.9.0"
sqlmodel = "^0.0.22"
python-dotenv = "^1.0.1"
pydantic-settings = "^2.6.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = "^3.3.0"
cryptography = "^50.0.0"
python-multipart = "^0.0.17"
numpy = "^2.1.3"
pandas = "^2.2.3"
scipy = "^1.14.1"
requests = "^2.32.3"
openpyxl = "^3.1.5"
xlsxwriter = "^3.2.0"
aiohttp = "^3.11.11"
pytest = "^8.3.4"
pytest-mock = "^3.14.0"
stripe = "^11.5.0"
alembic = "^1.14.1"
psycopg = {extras = ["binary"], version = "^3.2.10"}
boto3 = "^1.38.3"
ddtrace = "^3.7.0"
google-api-python-client = "^2.189.0"
google-auth-httplib2 = "^0.3.0"
google-auth-oauthlib = "^1.2.4"
alembic-postgresql-enum = "^1.10.0"
debugpy = "^1.8.0"
emails = {extras = ["jinja"], version = "^1.1.2"}
pillow = "^12.3.0"
graphifyy = "^0.9.37"
pyyaml = "^6.0.3"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
