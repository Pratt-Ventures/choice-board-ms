# src/pvf/example_pvf_app_watcher.yaml — annotated sample, 1:1 with src/pvf_app_watcher.yaml shape
# Copy to src/pvf_app_watcher.yaml at the application src root (sibling to pvf_app_startup.yaml).
# This file declares ONLY critical watcher bindings; operational tunables live in PvfGlobalSettings (.env).
#
# Env tunables that remain in PvfGlobalSettings (.env) — not here:
#   WATCHER_CAPTURE_PAYLOADS (bool, default 1)
#   WATCHER_NO_LOG_TYPES (csv, default "")
#   WATCHER_SHORTER_BUSY_POLL_SLEEP, WATCHER_LONGER_IDLE_INCREASING_POLL_SLEEP,
#   WATCHER_POLL_EXPONENTIAL_FACTOR, WATCHER_POLL_MAXIMUM_SLEEP_TIME
#   AI_SERVICE / AI_API_KEY / AI_MODEL / AI_BASE_URL etc.
#
# Critical bindings (YAML authoritative, no env override for `types`):
version: 1
capture_payloads: true          # full request/result persisted when True and tag not in no_log union
no_log_request_types: []        # union with PvfGlobalSettings.WATCHER_NO_LOG_TYPES; [] in prod, cleared in dev/test; tags here are suppressed even on error
types:
  # --- Builtin PVF handlers (kind: pvf) — framework provides the entry point ---
  llm:
    kind: pvf
    module: src.pvf.watcher.handlers.llm
    entry: handle_llm
    description: "Generic LLM queue (watcher_llm_requests table)"
  outbound_email:
    kind: pvf
    module: src.pvf.watcher.handlers.email
    entry: handle_email
    description: "Outbound email queue (watcher_email_requests table)"
  outbound_api_call:
    kind: pvf
    module: src.pvf.watcher.handlers.api
    entry: handle_api
    description: "Outbound API calls (watcher_api_requests table); V1 connection_protocol/auth_protocol always 'pvf'"
  # --- Application handlers (kind: app) — framework imports and calls them ---
  # Example: PowerChoice concise label generation. Remove or replace for your app.
  SHORTEN_PRODUCT_NAME:
    kind: app
    module: src.app.watcher_handlers
    entry: shorten_product_name
    description: "Application semantic tag; participates in no_log filtering when listed"
  # Additional app types need not be pre-declared — any work_type queued via
  # queue_generic_request with a not-yet-registered type is served from watcher_generic_jobs.
  # To bind a new type, add an entry here AND register it in app_shell.register_watcher_handlers.

# Loader: src/pvf/bindings/pvf_startup_config.py:load_watcher_config + apply_watcher_config
# Runner: src/pvf/pvf_app_runner.py (after apply_startup_config) + src/pvf/pvf_get_alembic_config.py
# Registry: src/pvf/watcher/registry.py (PvfWatcherRegistry on PvfInvocation)
